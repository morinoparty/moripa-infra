name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt / validate
        run: |
          terraform fmt -check -recursive terraform/
          terraform -chdir=terraform/envs/prod init -backend=false -input=false
          terraform -chdir=terraform/envs/prod validate

      - uses: astral-sh/setup-uv@v5

      - name: Python ツールを準備
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python ansible-core ansible-lint yamllint pyyaml
          .venv/bin/ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: .venv/bin/yamllint .

      # community.sops の vars plugin が host_vars/*/wireguard.sops.yml を復号するため、
      # ansible-inventory / syntax-check には sops バイナリと ci 用 age 鍵が要る
      # (fork からの PR では secrets が渡らずこのステップは失敗する)
      - name: sops を導入
        env:
          SOPS_VERSION: v3.13.3
        run: |
          base="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}"
          curl -sSL -o /tmp/sops "${base}/sops-${SOPS_VERSION}.linux.amd64"
          curl -sSL -o /tmp/sops.sha "${base}/sops-${SOPS_VERSION}.checksums.txt"
          expected=$(grep "sops-${SOPS_VERSION}.linux.amd64$" /tmp/sops.sha | awk '{print $1}')
          echo "${expected}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: ansible-lint / syntax-check / inventory
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          ../.venv/bin/ansible-lint
          for pb in playbooks/*.yml; do ../.venv/bin/ansible-playbook --syntax-check "$pb"; done
          ../.venv/bin/ansible-inventory --list > /dev/null

      - name: cilium values (common + 各 site) を helm template で検証
        run: |
          ver=$(grep -oP 'cilium_version: "\K[^"]+' ansible/group_vars/all/versions.yml)
          for s in site1 site2; do
            helm template cilium cilium --repo https://helm.cilium.io \
              --version "$ver" -n kube-system \
              -f kubernetes/common/cilium/values.yaml \
              -f "kubernetes/sites/$s/infrastructure/cilium/values.yaml" > /dev/null
          done
          lv=$(grep -oP 'longhorn_version: "\K[^"]+' ansible/group_vars/all/versions.yml)
          kv=$(grep -oP 'k8s_full_version: "\K[^"]+' ansible/group_vars/all/versions.yml)
          helm template longhorn longhorn --repo https://charts.longhorn.io --version "$lv" --kube-version "$kv" \
            -n longhorn-system -f kubernetes/sites/site1/infrastructure/storage/longhorn-values.yaml > /dev/null
          hv=$(grep -oP 'headlamp_version: "\K[^"]+' ansible/group_vars/all/versions.yml)
          helm template headlamp headlamp --repo https://kubernetes-sigs.github.io/headlamp --version "$hv" \
            -n headlamp -f kubernetes/sites/site1/infrastructure/headlamp/values.yaml > /dev/null

      - name: kustomize build(secrets/ksops を含む overlay は対象外)
        run: |
          for d in kubernetes/common/argocd \
                   kubernetes/common/gateway-api-crds \
                   kubernetes/common/cert-manager \
                   kubernetes/sites/site1/bootstrap/argocd \
                   kubernetes/sites/site1/bootstrap/applications \
                   kubernetes/sites/site1/infrastructure/storage \
                   kubernetes/sites/site1/infrastructure/headlamp \
                   kubernetes/sites/site1/infrastructure/monitoring \
                   kubernetes/sites/site1/apps \
                   kubernetes/sites/site2/bootstrap/argocd \
                   kubernetes/sites/site2/bootstrap/applications \
                   kubernetes/sites/site2/infrastructure/monitoring \
                   kubernetes/sites/site2/apps; do
            echo "== $d"
            kubectl kustomize "$d" > /dev/null
          done

      # ハブと同じカスタムビルド(caddy-dns/cloudflare 入り)で、git の Caddyfile と
      # Ansible 生成 snippet(auth 有効/無効の両方)を validate する
      - name: gateway/caddy/Caddyfile を caddy validate
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: make lint-caddy

      - name: check-consistency
        run: .venv/bin/python scripts/check_consistency.py

      - name: 平文の秘密を検出
        run: scripts/check_secrets.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: ドキュメントサイトをビルド
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
