name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt / validate
        run: |
          terraform fmt -check -recursive terraform/
          terraform -chdir=terraform/envs/prod init -backend=false -input=false
          terraform -chdir=terraform/envs/prod validate

      - uses: astral-sh/setup-uv@v5

      - name: Python ツールを準備
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python ansible-core ansible-lint yamllint pyyaml
          .venv/bin/ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: .venv/bin/yamllint .

      - name: ansible-lint / syntax-check / inventory
        working-directory: ansible
        run: |
          ../.venv/bin/ansible-lint
          for pb in playbooks/*.yml; do ../.venv/bin/ansible-playbook --syntax-check "$pb"; done
          ../.venv/bin/ansible-inventory --list > /dev/null

      - name: cilium values (common + 各 site) を helm template で検証
        run: |
          ver=$(grep -oP 'cilium_version: "\K[^"]+' ansible/group_vars/all/versions.yml)
          for s in site1 site2; do
            helm template cilium cilium --repo https://helm.cilium.io \
              --version "$ver" -n kube-system \
              -f kubernetes/common/cilium/values.yaml \
              -f "kubernetes/sites/$s/infrastructure/cilium/values.yaml" > /dev/null
          done

      - name: kustomize build(secrets/ksops を含む overlay は対象外)
        run: |
          for d in kubernetes/common/argocd \
                   kubernetes/common/gateway-api-crds \
                   kubernetes/common/cert-manager \
                   kubernetes/sites/site1/bootstrap/argocd \
                   kubernetes/sites/site1/bootstrap/applications \
                   kubernetes/sites/site1/infrastructure/ingress \
                   kubernetes/sites/site1/infrastructure/monitoring \
                   kubernetes/sites/site1/apps \
                   kubernetes/sites/site1/apps/minecraft \
                   kubernetes/sites/site2/bootstrap/argocd \
                   kubernetes/sites/site2/bootstrap/applications \
                   kubernetes/sites/site2/infrastructure/ingress \
                   kubernetes/sites/site2/infrastructure/monitoring \
                   kubernetes/sites/site2/apps; do
            echo "== $d"
            kubectl kustomize "$d" > /dev/null
          done

      - name: check-consistency
        run: .venv/bin/python scripts/check_consistency.py

      - name: 平文の秘密を検出
        run: scripts/check_secrets.sh
