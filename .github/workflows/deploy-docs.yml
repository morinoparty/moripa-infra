name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-docs.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Deploy Docs to Cloudflare Workers
    steps:
      - uses: actions/checkout@v7

      # pnpm (docs/package.json の packageManager) と Node (docs/.node-version) をまとめて入れる。
      # pnpm/action-setup の self-installer (npm 経由) を使わないので速い
      - uses: pnpm/setup@v3
        with:
          working-directory: docs
          cache: true      # pnpm store を docs/pnpm-lock.yaml ごとにキャッシュ
          install: false   # install は次の手順で --frozen-lockfile 付きで行う

      - name: Install
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: docs
        run: pnpm run build

      # デプロイトークンは BSM morinoparty プロジェクトの shared/CLOUDFLARE_API_TOKEN
      # から取得(moripath の deploy-storybook.yml と同じパターン)。
      # NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN は org シークレット
      # (org は Free プランのため public リポジトリでのみ参照可能。このリポジトリを
      # private に戻す場合は同名のリポジトリシークレットを登録すること)。
      # CF_ACCOUNT_ID はリポジトリシークレット
      - name: Get deploy token from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            d1a5c5d9-41cc-48f0-9035-b49901583491 > CLOUDFLARE_API_TOKEN

      # sm-action は env にしか出さないため、wrangler-action の with: から
      # 参照できるよう output 化(値は GitHub Actions がマスクする)
      - name: Expose deploy token as step output
        id: bws-deploy
        run: echo "cloudflare_api_token=$CLOUDFLARE_API_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy docs
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ steps.bws-deploy.outputs.cloudflare_api_token }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy
