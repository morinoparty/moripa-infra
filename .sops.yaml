# sops + age の暗号化ルール
#
# age 鍵は3つ(受信者)。公開鍵のみをここに置く(秘密部は ~/keys/ 等、repo 外):
#   - admin  : 管理者の鍵(手元の age-admin.agekey)
#   - ci     : GitHub Actions 用(Secrets に秘密部を登録)
#   - cluster: ksops(ArgoCD repo-server)復号用。秘密部は bootstrap 時に
#              Secret `sops-age` としてクラスタへ投入する
keys:
  - &admin age1x2rhgwpnwekfdeppgm5wll9rzsdqr48n0vk8xla4thtm9wwrzaps7urd3c
  - &ci age1w488y6mddrsk48c505nf3rnufxgyyv8zx3qxj3x6st4saevlns5sn0v4qw
  - &cluster age18c0ldwxzslhphke4gxaw2qgjdcpjp4d9dtzq8aew3sm7e383qpaq23607c
creation_rules:
  # Ansible の秘密変数(wg 秘密鍵など)
  - path_regex: ansible/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *admin
          - *ci
  # k8s Secret: data/stringData のみ暗号化し、kind/metadata は diff 可能に保つ
  - path_regex: kubernetes/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    key_groups:
      - age:
          - *admin
          - *ci
          - *cluster
