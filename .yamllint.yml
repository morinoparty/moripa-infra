extends: default

ignore: |
  .venv/
  .terraform/
  docs/

rules:
  line-length:
    max: 160
    level: warning
    # sops 暗号化ファイルは暗号文で行が長い
    ignore: |
      *.sops.yml
      *.sops.yaml
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off"]
  braces:
    max-spaces-inside: 1
