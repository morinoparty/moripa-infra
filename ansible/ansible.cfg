[defaults]
inventory = inventory/hosts.yml
# group_vars/ host_vars/ は ansible/ 直下に置いている。ansible-playbook は
# inventory または playbook に隣接するディレクトリしか読まないため、
# inventory/group_vars と inventory/host_vars を ../group_vars ../host_vars への
# symlink にしてある(消すと全変数が未定義になる)
roles_path = roles
# community.sops.sops を有効化: *.sops.yml の変数を実行時に自動復号する
vars_plugins_enabled = host_group_vars,community.sops.sops
interpreter_python = auto_silent
host_key_checking = True
forks = 10

[ssh_connection]
pipelining = True
