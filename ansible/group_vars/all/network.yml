# ネットワーク値の唯一の正(README のテーブルはここの写し)。
# 拠点固有の値(cluster_lan_cidr / kube_vip_address 等)は group_vars/site1.yml / site2.yml。
#
# ノードの LAN は DHCP のまま(アパートのルーターは触れず、固定 IP も保証できない)。
# クラスタ用には site*.yml の cluster_lan_cidr(ルーターと無関係な第 2 サブネット)を
# LAN NIC に重ね、DHCP で貰う LAN IP はどこにも使わない。

# terraform output -raw public_ip から転記(make tf-output)
gateway_public_ip: "139.162.104.78"
# WireGuard の Endpoint に使う公開 FQDN(Cloudflare に A と AAAA、DNS only / 灰色雲)。
# 空なら gateway_public_ip を使う。設定後は node-bootstrap の再生成と管理機の conf 更新が要る。
# AAAA は IPv4 が取れない拠点(v6 のみの LAN)向け。Cloud Firewall・ハブの listen・nftables は
# どちらも v6 対応済み。トンネルの中身は v4 のみ(AllowedIPs 0.0.0.0/0)
gateway_fqdn: gw.morino.party
gateway_public_ipv6: "2400:8902::2000:51ff:fe0a:794e"

wg_cidr: 10.100.0.0/24
wg_hub_address: 10.100.0.1
wg_port: 51820
# 自宅回線は IPv4 over IPv6(MAP-E 等)や PPPoE で経路 MTU が 1454〜1472 しかない
# (管理機で実測: 外側 ≈1472 → wg 内側の上限 1392)。余裕を見て 1360 に固定する。
# 1420 のままだと ssh の鍵交換など大きいパケットが詰まる
wg_mtu: 1360

# Linode 側 WAN NIC(Linode の Ubuntu イメージは eth0)
gateway_wan_interface: eth0

# inventory 外の WireGuard peer(管理者マシン等)。
# SSH は wg 経由のみの運用なので、管理者マシンを必ずここに登録する
wg_extra_peers:
  # name は <name>.wg.morino.party の DNS 名にもなる(ハイフンのみ、アンダースコア不可)
  - { name: nikomaru-minipc-01, public_key: "SkO8raeJ3sYVa3zz3N8zlacUpQFPUrPd08fLWD1geVk=", allowed_ips: 10.100.0.100/32 }  # Linux 管理機(Ansible 実行元)
  - { name: nikomaru-gamepc-01, public_key: "nJfl9ocIyh6yC3PLkShe7Nyd+9bAe/pPWcnZ1MG7ygU=", allowed_ips: 10.100.0.101/32 }  # Windows 機(WireGuard for Windows)
  - { name: nikomaru-note-01, public_key: "2wwD3HhXGDmfaeXqMttKCNYHjvCJxVMq9SezqMn41ic=", allowed_ips: 10.100.0.102/32 }  # ノート PC(管理用)
  # 監視対象の外部マシン(セットアップは Ansible 管理外・監視経路のみの限定トンネル)
  - { name: moripa-tutu, public_key: "XCBLS1P1XiXjvC9qTwpWSH++GPB5SeWr0aH1HcODYWI=", allowed_ips: 10.100.0.103/32 }

# Pod / Service CIDR は両拠点で同一値を使う。クラスタ同士は接続しないため
# 重複しても問題ない(将来 cluster mesh 等で接続するなら再IP設計が必要 →
# docs/content/docs/architecture/multi-site.mdx)
pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12
kube_api_port: 6443

# Linode 上の HAProxy(L4 TCP プロキシ)。HTTP 以外のサービスを port で受け、wg 越しに
# 拠点のノードへ転送する(ヘルスチェック付き)。転送先は 3 通り(どれか 1 つ):
#   - site + node_port        : その拠点の全クラスタノードの NodePort(k8s の Service)
#   - site + hosts(+ target_port): 指定ホストだけの同じ port(または target_port)。
#                               Pod ではなくホスト上の docker が port を持つもの(Wings のゲームサーバー等)
#   - site + minecraft_hosts  : 1 つの port で受け、Minecraft の handshake に入っている接続先
#                               ホスト名(HTTPS の SNI 相当)でサーバーを選ぶ。どれにも一致しなければ切断。
#                               DNS は *.minecraft.gw.morino.party(Cloudflare、ハブの公開 IP)
# クライアント実IPは L4 では届かない(Minecraft なら前段の Velocity が
# modern forwarding でプレイヤー IP を渡す前提)。
# allowed_sources を指定すると nftables でその送信元だけに絞る(空なら全公開)。
# terraform/envs/prod の public_tcp_ports = tcp_routes の port + proxy_public_ports
# であること(check-consistency で検査)。行を足したら make gateway + make tf-apply
tcp_routes:
  # Pelican Wings(site1-node2、docs/admin/wings)。SFTP とゲームサーバーの割り当てポート
  - { name: wings-sftp, port: 2022, site: site1, hosts: [site1-node2] }
  # Minecraft はすべて 25565 で受け、ホスト名で振り分ける。ホスト名 → サーバーの対応表は
  # 公開しないので sops で暗号化した group_vars/gateway/minecraft.sops.yml(形式は .example)
  - name: minecraft
    port: 25565
    site: site1
    minecraft_hosts: "{{ minecraft_hosts_site1 }}"
#  - { name: minecraft, port: 25565, site: site1, node_port: 30565, allowed_sources: ["203.0.113.50/32"] }

# ハブを入口にする公開名(site1-node2.gw.morino.party 等)は Cloudflare の A / AAAA(ハブの公開 IP、
# DNS only)だけで管理し、wg 内の dnsmasq では上書きしない(上流へ転送して同じ答えを返す)。
# wg 内でだけ 10.100.0.1 を返すと、公開サイト(パネル等)のページからブラウザが
# プライベート IP へ fetch する形になり、Local Network Access の許可プロンプト・ブロックの対象になる

# Linode 上の Caddy(リバースプロキシ)。HTTP/HTTPS はここで受けて TLS を終端し、
# ホスト名ごとに対象拠点の全ノード :80(Cilium Gateway, hostNetwork)へ wg 越しに転送する。
#
# ルーティング表(どのホスト名をどの拠点へ、どれに認証を掛けるか)は Ansible ではなく
# git の gateway/caddy/Caddyfile。ハブの caddy-gitops.timer が main を取り込み、
# `caddy validate` を通してから reload する(caddy_gitops_*)。Ansible が出すのは
# 配管(/etc/caddy/generated.caddy の snippet: 拠点ごとの upstream、Cloudflare DNS-01 の
# tls、oauth2-proxy 連携)だけ。upstream は inventory の groups[site] から自動導出する。
#
# 命名規約(証明書は Cloudflare DNS-01 のワイルドカード。1 ラベルしか包まないので
# 階層ごとに 1 枚):
#   <app>.site1.dev.morino.party          → site1(公開)
#   <app>.site1.private.dev.morino.party  → site1(oauth2-proxy で認証)
#   auth.dev.morino.party                 → 認証ポータル(oauth2-proxy のコールバック先)
# DNS は上記の各ワイルドカード(*.site1.dev 等)と auth.dev を gateway_public_ip に
# 向ける(DNS only / 灰色雲)。証明書取得自体は A レコードに依存しない。
# クライアント実IPは X-Forwarded-For の先頭で渡す(Envoy がハブの wg アドレスを末尾に追記する)
# 8443 は Wings API(site1-node2.gw.morino.party:8443 → site1-node2:8080。Caddyfile 参照)
proxy_public_ports: [80, 443, 8443]
# Caddy の公式ビルド API から caddy-dns/cloudflare 入りのバイナリを取得し、apt 版を
# dpkg-divert + update-alternatives で差し替える(バージョンは versions.yml)。
# Cloudflare の API トークン(Zone.DNS:Edit, morino.party)は
# group_vars/gateway/auth.sops.yml の cloudflare_dns_api_token
caddy_gitops_repo_url: https://github.com/morinoparty/moripa-infra.git
caddy_gitops_branch: main
caddy_gitops_subdir: gateway/caddy
caddy_gitops_interval: 3min

# oauth2-proxy(Linode 上、Caddy の forward auth)。*.site<N>.private.dev.morino.party への
# アクセスは次のどちらかを満たすと通す(2 プロセス。oauth2-proxy は複数 provider を
# 1 プロセスで扱えない):
#   github  : GitHub org "morinoparty" のメンバー
#   mineauth: MineAuth(OIDC)で roles クレームに "staff" を持つ
# クライアント ID/secret・cookie secret は group_vars/gateway/auth.sops.yml。
# 値を入れて oauth2_proxy_enabled: true にするまで private ホストは 503 を返す(fail closed)
oauth2_proxy_enabled: true
auth_host: auth.dev.morino.party
# cookie を共有するドメイン(private ホストと auth_host の共通の親)
auth_cookie_domain: .dev.morino.party
oauth2_proxy_providers:
  github:
    port: 4180
    org: morinoparty
    # GitHub OAuth App の Authorization callback URL:
    #   https://auth.dev.morino.party/oauth2/github/callback
  mineauth:
    port: 4181
    # MineAuth の OIDC issuer(/.well-known/openid-configuration を持つ URL)
    issuer_url: "https://api.morino.party/main"
    scope: "openid profile email roles"
    groups_claim: roles
    allowed_groups: [staff]
    # MineAuth が email を返さない構成なら preferred_username 等に変える
    email_claim: email
    # Redirect URI: https://auth.dev.morino.party/oauth2/mineauth/callback

# WireGuard インターフェース名
wg_interface: wg0

# wg 内の名前解決(ハブの dnsmasq、10.100.0.1:53、wg0 からのみ応答)。
# <inventory_hostname>.<wg_dns_domain> → wg_address、wg_extra_peers の name も同様。
# linode-gw には別名 gw も付く。クライアントは [Interface] に DNS = 10.100.0.1 を書く
# (Linux は resolvectl で ~wg.morino.party だけ向けるのが推奨、docs/admin/keys 参照)
wg_dns_domain: wg.morino.party
wg_dns_gateway_alias: gw
# ゾーン外の問い合わせの転送先(クライアントが DNS を 10.100.0.1 一本にしても困らないように)
wg_dns_upstreams: [1.1.1.1, 1.0.0.1]
