# ネットワーク値の唯一の正(README のテーブルはここの写し)。
# 拠点固有の値(cluster_lan_cidr / kube_vip_address 等)は group_vars/site1.yml / site2.yml。
#
# ノードの LAN は DHCP のまま(アパートのルーターは触れず、固定 IP も保証できない)。
# クラスタ用には site*.yml の cluster_lan_cidr(ルーターと無関係な第 2 サブネット)を
# LAN NIC に重ね、DHCP で貰う LAN IP はどこにも使わない。

# terraform output -raw public_ip から転記(make tf-output)
gateway_public_ip: "139.162.104.78"

wg_cidr: 10.100.0.0/24
wg_hub_address: 10.100.0.1
wg_port: 51820
wg_mtu: 1420

# Linode 側 WAN NIC(Linode の Ubuntu イメージは eth0)
gateway_wan_interface: eth0

# inventory 外の WireGuard peer(管理者マシン等)。
# SSH は wg 経由のみの運用なので、管理者マシンを必ずここに登録する
wg_extra_peers:
  - { name: admin, public_key: "SkO8raeJ3sYVa3zz3N8zlacUpQFPUrPd08fLWD1geVk=", allowed_ips: 10.100.0.100/32 }  # 管理者マシン(秘密鍵は ~/keys/wg-admin.key)
  - { name: admin-windows, public_key: "nJfl9ocIyh6yC3PLkShe7Nyd+9bAe/pPWcnZ1MG7ygU=", allowed_ips: 10.100.0.101/32 }  # 管理者の Windows 機(WireGuard for Windows)

# Pod / Service CIDR は両拠点で同一値を使う。クラスタ同士は接続しないため
# 重複しても問題ない(将来 cluster mesh 等で接続するなら再IP設計が必要 →
# docs/content/docs/architecture/multi-site.mdx)
pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12
kube_api_port: 6443

# Linode 上の HAProxy(L4 TCP プロキシ)。Minecraft など HTTP 以外のサービスを
# port で受け、対象拠点の全ノードの NodePort へ wg 越しに転送する(ヘルスチェック付き)。
# クライアント実IPは L4 では届かない(Minecraft は前段の Velocity が
# modern forwarding でプレイヤー IP を渡す前提)。
# allowed_sources を指定すると nftables でその送信元だけに絞る(Velocity の IP を
# 入れて、バックエンドへの直接接続を防ぐこと。空なら全公開)。
# terraform/envs/prod の public_tcp_ports = tcp_routes の port + proxy_public_ports
# であること(check-consistency で検査)
tcp_routes:
  - { name: minecraft, port: 25565, site: site1, node_port: 30565, allowed_sources: [] }
#  - { name: minecraft-site2, port: 25566, site: site2, node_port: 30565, allowed_sources: ["203.0.113.50/32"] }

# Linode 上の Caddy(リバースプロキシ)。HTTP/HTTPS はここで受けて TLS を終端し、
# ホスト名ごとに対象拠点の全ノード :80(Cilium Gateway, hostNetwork)へ
# wg 越しに転送する。upstream は inventory の groups[site] から自動導出するので
# ノードの増減で編集不要。ノード障害時は Caddy が別ノードへ自動で切り替える。
# 証明書は Let's Encrypt(HTTP-01)で自動取得するため、host の DNS を
# gateway_public_ip に向けてから追加すること(未解決のホストは ACME に失敗し続ける)。
# クライアント実IPは X-Forwarded-For で渡す(cilium values の xffNumTrustedHops=1 が前提)
proxy_public_ports: [80, 443]
proxy_acme_email: yahiro@morino.party
proxy_routes: []
#  - { host: "example.morino.party", site: site1 }

# WireGuard インターフェース名
wg_interface: wg0

# wg 内の名前解決(ハブの dnsmasq、10.100.0.1:53、wg0 からのみ応答)。
# <inventory_hostname>.<wg_dns_domain> → wg_address、wg_extra_peers の name も同様。
# linode-gw には別名 gw も付く。クライアントは [Interface] に DNS = 10.100.0.1 を書く
# (Linux は resolvectl で ~wg.morino.party だけ向けるのが推奨、docs/admin/keys 参照)
wg_dns_domain: wg.morino.party
wg_dns_gateway_alias: gw
# ゾーン外の問い合わせの転送先(クライアントが DNS を 10.100.0.1 一本にしても困らないように)
wg_dns_upstreams: [1.1.1.1, 1.0.0.1]
