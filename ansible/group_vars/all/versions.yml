# バージョンピンの一元管理(2026-08-31 に各リリースページで確認済み)

# pkgs.k8s.io のマイナーリポジトリ。パッチはリポジトリ内最新を導入して apt hold
k8s_version: "1.35"
# kubeadm ClusterConfiguration 用(pkgs.k8s.io v1.35 の最新パッチ)
k8s_full_version: "v1.35.8"

# 1.19 系の最新パッチ(1.20 はリリース直後のため見送り)
cilium_version: "1.19.7"
kube_vip_version: "v1.2.3"

# Cilium 1.19 がサポートする Gateway API バージョン(docs.cilium.io v1.19 で確認)
gateway_api_version: "v1.4.1"

helm_version: "v3.21.4"

# kubeadm が期待する pause イメージ(`kubeadm config images list` で要確認)
pause_image: registry.k8s.io/pause:3.10

# Linode 上の Caddy。公式ビルド API(caddyserver.com/api/download)で
# caddy-dns/cloudflare を組み込んだバイナリを取得する
caddy_version: "v2.11.4"
caddy_cloudflare_module_version: "v0.2.4"

# oauth2-proxy(GitHub Releases の linux-amd64 tarball と sha256)
oauth2_proxy_version: "v7.15.4"
oauth2_proxy_sha256: "4fbe902189aab713d9c0519b90a645032d4636ecb523dc36f5cc312d8ebef1e2"

# Longhorn(charts.longhorn.io。kubernetes/sites/*/bootstrap/applications/storage.yaml の
# targetRevision と一致させる。check-consistency が検査)
longhorn_version: "1.12.1"

# Headlamp(kubernetes-sigs.github.io/headlamp の chart。bootstrap/applications/headlamp.yaml と一致)
headlamp_version: "0.45.0"

# kube-prometheus-stack(prometheus-community.github.io/helm-charts の chart。
# bootstrap/applications/monitoring.yaml と一致)
kube_prometheus_stack_version: "90.1.1"
