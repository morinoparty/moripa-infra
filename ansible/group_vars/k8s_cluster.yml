wg_role: spoke
ansible_user: "{{ admin_user }}"

# kube-vip が VIP を張る NIC。wg0 の自動検出事故を防ぐため必ず LAN NIC を指す
# (NIC 名確定後は "enp1s0" 等で固定推奨)
kube_vip_interface: "{{ lan_interface }}"

# 管理経路は WireGuard(ansible_host = wg アドレス)。
# ノードの LAN IP は DHCP + ルーター側 MAC 予約で固定し、Ansible からは
# ansible_default_ipv4.address(= LAN の実IP)としてファクトで参照する。
# 前提: 各ノードで node-bootstrap 済み(wg が張られていないと到達不能)
