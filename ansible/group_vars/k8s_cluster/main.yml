wg_role: spoke
ansible_user: "{{ admin_user }}"

# LAN NIC 名(lan_interface)は拠点ごとに group_vars/site<N>.yml で固定する。
# 未指定なら roles/cluster_lan/tasks/detect.yml が main テーブルの default route から
# 自動検出する(フルトンネル下では ansible_default_ipv4 が wg0 を返すので使わない)

# kube-vip が VIP を張る NIC(= 検出した LAN NIC。wg0 は不可)
kube_vip_interface: "{{ cluster_lan_interface }}"

# 管理経路は WireGuard(ansible_host = wg アドレス)。クラスタ通信は
# cluster_lan_cidr の lan_address(LAN 直通)。DHCP で貰う LAN IP は使わない。
# 前提: 各ノードで node-bootstrap 済み(wg が張られていないと到達不能)

# 初回接続の認証: 現地で OS を入れた直後のノードは SSH 鍵も sudo NOPASSWD も
# 無いため、同ディレクトリの bootstrap.sops.yml(sops 暗号化)に
# ansible_password / ansible_become_password(現地作業者に渡した moripa の
# パスワード)を置く。base ロールが鍵と NOPASSWD を配った後も残して害はない。
# 管理機には sshpass が必要(docs/content/docs/admin/ansible.mdx)

# ノードのデータ領域(roles/longhorn_prereq)。Ubuntu の既定インストールはルート LV が
# 100GB で残りの VG が未使用なので、残り全部で LV を切って /data にマウントする。
# Longhorn は /data/longhorn、hostPath / local-path を使うときも /data 配下に置く
# (ルートと分離されるのでボリュームが肥大化しても OS が詰まらない)
data_vg: ubuntu-vg
data_lv: data
data_mount: /data
longhorn_data_path: "{{ data_mount }}/longhorn"

# Pod / CoreDNS の上流 DNS(kubelet --resolv-conf)。拠点の LAN が IPv6 のみでも Pod(IPv4)から
# 届くように、wg のハブ(dnsmasq。<host>.wg.morino.party も引ける)と public DNS を使う
node_pod_dns_upstreams:
  - "{{ wg_hub_address }}"
  - 1.1.1.1

# Cilium の ingress controller(hostNetwork)が listen するポート。
# kubernetes/common/cilium/values.yaml の ingressController.hostNetwork.sharedListenerPort と
# 一致させる(make check-consistency で検査)。roles/k8s_prereq がこのポートを wg0 / lo からのみ許可する
ingress_listener_port: 80
