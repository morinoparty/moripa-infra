site_name: site1
# クラスタ用の第 2 サブネット。アパートのルーターは触れず DHCP の範囲も分からないため、
# ルーターと無関係な private CIDR を LAN NIC に重ねる(同じスイッチ配下なら
# ノード同士は直接 ARP で通信できる)。実際の LAN がたまたま 10.200.x.x なら変更すること。
# inventory の lan_address はこの CIDR 内(check-consistency が検査)
cluster_lan_cidr: 10.200.1.0/24
# kube-vip の VIP(cluster_lan_cidr 内。ARP mode で LAN NIC に張る)。
# cilium values の k8sServiceHost と一致させる(check-consistency が検査)
kube_vip_address: 10.200.1.10
# この拠点のクラスタの control-plane グループ名(k8s_bootstrap が参照)
k8s_cp_group: site1_control_plane
# この拠点の Cilium サイト差分 values(リポジトリルートからの相対パス)
cilium_site_values_relpath: kubernetes/sites/site1/infrastructure/cilium/values.yaml
