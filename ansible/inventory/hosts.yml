all:
  children:
    gateway:
      hosts:
        linode-gw:
          ansible_host: "{{ gateway_public_ip }}"
          wg_address: 10.100.0.1
    # k8s_cluster = 全拠点の全ノード(wg spoke / prereq の対象)。
    # 拠点ごとに独立した k8s クラスタを持つ(site1 / site2)
    k8s_cluster:
      children:
        site1:
          children:
            site1_control_plane:
              hosts:
                site1-node1: { ansible_host: 192.168.10.11, wg_address: 10.100.0.11 }
                site1-node2: { ansible_host: 192.168.10.12, wg_address: 10.100.0.12 }
                site1-node3: { ansible_host: 192.168.10.13, wg_address: 10.100.0.13 }
            # 将来のノード追加用(現状は 3台全部 control-plane / schedulable)
            site1_workers: {}
        site2:
          children:
            site2_control_plane:
              hosts:
                site2-node1: { ansible_host: 192.168.20.11, wg_address: 10.100.0.21 }
                site2-node2: { ansible_host: 192.168.20.12, wg_address: 10.100.0.22 }
                site2-node3: { ansible_host: 192.168.20.13, wg_address: 10.100.0.23 }
            site2_workers: {}
