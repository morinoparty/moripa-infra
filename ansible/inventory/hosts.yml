all:
  children:
    gateway:
      hosts:
        linode-gw:
          ansible_host: "{{ gateway_public_ip }}"
          wg_address: 10.100.0.1
    # k8s_cluster = 全拠点の全ノード。拠点ごとに独立した k8s クラスタを持つ。
    # 各拠点は 2台構成: node1 = control-plane(stacked etcd, schedulable)、
    # node2 = worker。etcd は 1メンバーなので HA ではない(etcd バックアップ必須)。
    #
    # wg_address : WireGuard アドレス(管理経路。ansible_host と必ず一致させる)
    # lan_address: クラスタ用アドレス。ルーターの DHCP とは無関係な第 2 サブネット
    #              (group_vars/site*.yml の cluster_lan_cidr)を Ansible が LAN NIC に
    #              追加する。kubelet の node-ip / kubeadm / Cilium VXLAN はこれを使い、
    #              DHCP で貰う LAN IP はどこにも焼き込まない
    # node-bootstrap で wg が張られていることが Ansible 実行の前提になる。
    k8s_cluster:
      children:
        site1:
          children:
            site1_control_plane:
              hosts:
                site1-node1: { ansible_host: 10.100.0.11, wg_address: 10.100.0.11, lan_address: 10.200.1.11 }
            site1_workers:
              hosts:
                site1-node2: { ansible_host: 10.100.0.12, wg_address: 10.100.0.12, lan_address: 10.200.1.12 }
        site2:
          children:
            site2_control_plane:
              hosts:
                site2-node1: { ansible_host: 10.100.0.21, wg_address: 10.100.0.21, lan_address: 10.200.2.11 }
            site2_workers:
              hosts:
                site2-node2: { ansible_host: 10.100.0.22, wg_address: 10.100.0.22, lan_address: 10.200.2.12 }
