all:
  children:
    gateway:
      hosts:
        linode-gw:
          # 定常運用は wg 経由(公開 22 番は Cloud Firewall で閉じている)。
          # 初回 bootstrap(wg 確立前)だけ公開 IP を使う:
          #   make gateway ANSIBLE_ARGS='-e ansible_host=<gateway_public_ip>'
          ansible_host: 10.100.0.1
          wg_address: 10.100.0.1
    # 拠点グループ site1 / site2 = その拠点に置く全マシン(クラスタ参加 + 予備)。
    # k8s_cluster = クラスタに参加させるノードだけ(make cluster の対象)。
    # site1 は 3 台とも control-plane(stacked etcd 3 メンバー、全ノード schedulable)。
    # 1 台落ちても quorum が残り、Longhorn の 3 レプリカと合わせて動き続ける。
    # site2 は現状 node1 = control-plane、node2 = worker(etcd 1 メンバー、HA ではない)。
    #
    # wg_address : WireGuard アドレス(管理経路。ansible_host と必ず一致させる)
    # lan_address: クラスタ用アドレス。ルーターの DHCP とは無関係な第 2 サブネット
    #              (group_vars/site*.yml の cluster_lan_cidr)を Ansible が LAN NIC に
    #              追加する。kubelet の node-ip / kubeadm / Cilium VXLAN はこれを使い、
    #              DHCP で貰う LAN IP はどこにも焼き込まない
    # node-bootstrap で wg が張られていることが Ansible 実行の前提になる。
    #
    # 予備(site<N>_spare): wg 鍵・ハブのピア・DNS・bootstrap スクリプトだけ先に用意しておく
    # マシン。クラスタには入れない(Caddy / HAProxy の転送先にもならない)。
    # 投入するときは行を site<N>_workers(または control_plane)へ移して make cluster
    site1:
      children:
        site1_control_plane:
          hosts:
            site1-node1: { ansible_host: 10.100.0.11, wg_address: 10.100.0.11, lan_address: 10.200.1.11 }
            site1-node2: { ansible_host: 10.100.0.12, wg_address: 10.100.0.12, lan_address: 10.200.1.12 }
            site1-node3: { ansible_host: 10.100.0.13, wg_address: 10.100.0.13, lan_address: 10.200.1.13 }
        # worker は今のところ無し(4 台目以降を入れるならここ)
        site1_workers:
          hosts: {}
        site1_spare:
          hosts:
            site1-node4: { ansible_host: 10.100.0.14, wg_address: 10.100.0.14, lan_address: 10.200.1.14 }
    site2:
      children:
        site2_control_plane:
          hosts:
            site2-node1: { ansible_host: 10.100.0.21, wg_address: 10.100.0.21, lan_address: 10.200.2.11 }
        site2_workers:
          hosts:
            site2-node2: { ansible_host: 10.100.0.22, wg_address: 10.100.0.22, lan_address: 10.200.2.12 }
        site2_spare:
          hosts:
            site2-node3: { ansible_host: 10.100.0.23, wg_address: 10.100.0.23, lan_address: 10.200.2.13 }
            site2-node4: { ansible_host: 10.100.0.24, wg_address: 10.100.0.24, lan_address: 10.200.2.14 }
    k8s_cluster:
      children:
        site1_control_plane:
        site1_workers:
        site2_control_plane:
        site2_workers:
    spare:
      children:
        site1_spare:
        site2_spare:
