- name: 共通設定 + WireGuard spoke(全拠点)
  hosts: k8s_cluster
  # 途中で失敗しても notify 済みの handler(nftables reload 等)を必ず実行する
  force_handlers: true
  roles:
    - base
    - wireguard

- name: クラスタ用の第 2 サブネットを LAN NIC に追加(全拠点)
  hosts: k8s_cluster
  # 途中で失敗しても notify 済みの handler(nftables reload 等)を必ず実行する
  force_handlers: true
  roles:
    - cluster_lan

- name: k8s 前提(containerd / kubeadm)(全拠点)
  hosts: k8s_cluster
  # 途中で失敗しても notify 済みの handler(nftables reload 等)を必ず実行する
  force_handlers: true
  roles:
    - k8s_prereq

# 各拠点の control-plane は現状 1台(node1)。将来 CP を追加する場合も
# serial: 1 で先頭 CP の init 完了後に残りが順に join する
# (etcd メンバー追加の同時実行を避ける)。拠点ごとに独立したクラスタ
- name: site1 control-plane を構築
  hosts: site1_control_plane
  # 途中で失敗しても notify 済みの handler(nftables reload 等)を必ず実行する
  force_handlers: true
  serial: 1
  roles:
    - role: k8s_bootstrap
      vars:
        k8s_bootstrap_mode: control_plane

- name: site2 control-plane を構築
  hosts: site2_control_plane
  # 途中で失敗しても notify 済みの handler(nftables reload 等)を必ず実行する
  force_handlers: true
  serial: 1
  roles:
    - role: k8s_bootstrap
      vars:
        k8s_bootstrap_mode: control_plane

- name: worker を join(各拠点の node2)
  hosts: site1_workers:site2_workers
  # 途中で失敗しても notify 済みの handler(nftables reload 等)を必ず実行する
  force_handlers: true
  roles:
    - role: k8s_bootstrap
      vars:
        k8s_bootstrap_mode: worker

- name: Cilium を投入し、各クラスタを検証
  hosts: site1_control_plane[0]:site2_control_plane[0]
  # 途中で失敗しても notify 済みの handler(nftables reload 等)を必ず実行する
  force_handlers: true
  roles:
    - role: k8s_bootstrap
      vars:
        k8s_bootstrap_mode: cilium
