# Linode(ハブ)上の oauth2-proxy。Caddy の *.site<N>.private.dev.morino.party から
# forward auth で問い合わせを受ける(generated.caddy の auth_required snippet)。
# oauth2-proxy は 1 プロセスに複数 provider を持てない(alpha config でも未実装)ので、
# provider ごとに oauth2-proxy@<name>.service を立て、Caddy が順に問い合わせる:
#   github  : 127.0.0.1:4180、GitHub org morinoparty のメンバーを許可
#   mineauth: 127.0.0.1:4181、MineAuth(OIDC)の roles クレームに staff を含む人を許可
# どちらも cookie ドメインは auth_cookie_domain(.dev.morino.party)、コールバックは
# https://<auth_host>/oauth2/<name>/callback(proxy_prefix で分ける)。
# 秘密(client id/secret, cookie secret)は group_vars/gateway/auth.sops.yml(未設定なら
# oauth2_proxy_enabled: false のままにする。設定ファイルも起動もしない)

- name: oauth2-proxy の設定が揃っているか確認(oauth2_proxy_enabled のとき)
  ansible.builtin.assert:
    that:
      - oauth2_proxy_github_client_id | default('') | length > 0
      - oauth2_proxy_github_client_secret | default('') | length > 0
      - oauth2_proxy_mineauth_client_id | default('') | length > 0
      - oauth2_proxy_mineauth_client_secret | default('') | length > 0
      - oauth2_proxy_github_cookie_secret | default('') | length > 0
      - oauth2_proxy_mineauth_cookie_secret | default('') | length > 0
      - not (oauth2_proxy_github_client_id | default('') is search('^REPLACE_WITH'))
      - not (oauth2_proxy_mineauth_client_id | default('') is search('^REPLACE_WITH'))
      - not (oauth2_proxy_providers.mineauth.issuer_url is search('^REPLACE_WITH'))
    fail_msg: "group_vars/gateway/auth.sops.yml と network.yml(mineauth.issuer_url)を埋めてから oauth2_proxy_enabled: true にすること"
  when: oauth2_proxy_enabled

- name: oauth2-proxy 用のシステムユーザー
  ansible.builtin.user:
    name: oauth2-proxy
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/oauth2-proxy
    create_home: false
  become: true

- name: 現在のバージョンを確認
  ansible.builtin.command: /usr/local/bin/oauth2-proxy --version
  register: auth_proxy_ver
  changed_when: false
  failed_when: false

- name: oauth2-proxy を取得(GitHub Releases、sha256 検証)
  when: auth_proxy_ver.rc != 0 or (oauth2_proxy_version | regex_replace('^v', '')) not in auth_proxy_ver.stdout
  become: true
  block:
    - name: tarball をダウンロード
      ansible.builtin.get_url:
        url: "https://github.com/oauth2-proxy/oauth2-proxy/releases/download/{{ oauth2_proxy_version }}\
              /oauth2-proxy-{{ oauth2_proxy_version }}.linux-amd64.tar.gz"
        dest: /tmp/oauth2-proxy.tar.gz
        checksum: "sha256:{{ oauth2_proxy_sha256 }}"
        mode: "0644"

    - name: 展開して配置
      ansible.builtin.unarchive:
        src: /tmp/oauth2-proxy.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include: ["oauth2-proxy-{{ oauth2_proxy_version }}.linux-amd64/oauth2-proxy"]
        extra_opts: ["--strip-components=1"]
        owner: root
        group: root
        mode: "0755"
      notify: Restart oauth2-proxy

- name: 設定ディレクトリ
  ansible.builtin.file:
    path: /etc/oauth2-proxy
    state: directory
    owner: root
    group: oauth2-proxy
    mode: "0750"
  become: true

- name: systemd テンプレート unit
  ansible.builtin.template:
    src: oauth2-proxy@.service.j2
    dest: /etc/systemd/system/oauth2-proxy@.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart oauth2-proxy

- name: provider ごとの設定ファイル
  ansible.builtin.template:
    src: "{{ item }}.cfg.j2"
    dest: "/etc/oauth2-proxy/{{ item }}.cfg"
    owner: root
    group: oauth2-proxy
    mode: "0640"
  loop: "{{ oauth2_proxy_providers | list }}"
  become: true
  when: oauth2_proxy_enabled
  notify: Restart oauth2-proxy

- name: oauth2-proxy@<provider> を有効化・起動
  ansible.builtin.systemd_service:
    name: "oauth2-proxy@{{ item }}"
    enabled: "{{ oauth2_proxy_enabled }}"
    state: "{{ 'started' if oauth2_proxy_enabled else 'stopped' }}"
    daemon_reload: true
  loop: "{{ oauth2_proxy_providers | list }}"
  become: true
