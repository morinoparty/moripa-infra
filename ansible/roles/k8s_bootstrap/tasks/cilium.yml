# 先頭 CP で実行する(playbooks/cluster.yml)。KUBECONFIG は admin.conf。

# common → site の順でマージ(ArgoCD の valueFiles と同一順)
- name: cilium values (git 管理) を読み込んでマージ
  ansible.builtin.set_fact:
    k8s_bootstrap_cilium_values: >-
      {{ (lookup('ansible.builtin.file',
                 playbook_dir + '/../../kubernetes/common/cilium/values.yaml')
          | from_yaml)
         | combine(lookup('ansible.builtin.file',
                          playbook_dir + '/../../' + cilium_site_values_relpath)
                   | from_yaml, recursive=True) }}

# group_vars と git 上の values の乖離を実行前に強制検出する。
# ArgoCD が同じ values で引き取るため、ここの整合が diff ゼロの前提になる
- name: cilium values と group_vars の整合を検証
  ansible.builtin.assert:
    that:
      - k8s_bootstrap_cilium_values.k8sServiceHost == kube_vip_address
      - k8s_bootstrap_cilium_values.k8sServicePort | int == kube_api_port | int
      - k8s_bootstrap_cilium_values.kubeProxyReplacement | bool
      - k8s_bootstrap_cilium_values.routingMode == "tunnel"
      - k8s_bootstrap_cilium_values.tunnelProtocol == "vxlan"
      - pod_cidr in k8s_bootstrap_cilium_values.ipam.operator.clusterPoolIPv4PodCIDRList
      - wg_interface in k8s_bootstrap_cilium_values.devices
    fail_msg: >-
      cilium values (common + {{ cilium_site_values_relpath }}) が
      ansible/group_vars と一致していない(make check-consistency 参照)

- name: helm バイナリを導入
  ansible.builtin.unarchive:
    src: https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, linux-amd64/helm]
    creates: /usr/local/bin/helm
    mode: "0755"
  become: true

- name: Gateway API CRD を投入(Cilium より先。無いと Gateway 機能がサイレント無効)
  ansible.builtin.command: >-
    kubectl apply --server-side -f
    https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: k8s_bootstrap_gwapi
  changed_when: "'serverside-applied' in k8s_bootstrap_gwapi.stdout"
  become: true

- name: cilium values (common) をノードへ配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../kubernetes/common/cilium/values.yaml"
    dest: /etc/kubernetes/cilium-values-common.yaml
    mode: "0644"
  become: true

- name: cilium values (site) をノードへ配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ cilium_site_values_relpath }}"
    dest: /etc/kubernetes/cilium-values-site.yaml
    mode: "0644"
  become: true

- name: Cilium を Helm で投入(ArgoCD が後で同じ values で引き取る)
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium
    chart_repo_url: https://helm.cilium.io
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    values_files:
      - /etc/kubernetes/cilium-values-common.yaml
      - /etc/kubernetes/cilium-values-site.yaml
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_timeout: 10m
  become: true

- name: control-plane の taint を確認
  ansible.builtin.command: >-
    kubectl get node {{ item }}
    -o jsonpath={.spec.taints[*].key}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop: "{{ groups[k8s_cp_group] }}"
  register: k8s_bootstrap_taints
  changed_when: false
  become: true

- name: control-plane の taint を除去(schedulable にする)
  ansible.builtin.command: >-
    kubectl taint nodes {{ item.item }}
    node-role.kubernetes.io/control-plane:NoSchedule-
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop: "{{ k8s_bootstrap_taints.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'node-role.kubernetes.io/control-plane' in item.stdout"
  become: true

- name: 全ノードが Ready になるのを待つ
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready node --all --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  become: true
