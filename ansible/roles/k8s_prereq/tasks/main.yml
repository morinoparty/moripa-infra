# --- swap 無効化 -------------------------------------------------------------

- name: swap を即時無効化
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: ansible_swaptotal_mb > 0
  become: true

- name: fstab の swap エントリをコメントアウト
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
  become: true

# --- カーネル設定 ------------------------------------------------------------

- name: カーネルモジュールを常時ロード
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"
  become: true

- name: カーネルモジュールを即時ロード
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]
  become: true

- name: k8s 用 sysctl を設定
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/90-kubernetes.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
  become: true

# --- containerd (Ubuntu 26.04 同梱の 2.x, config v3) -------------------------

- name: containerd を導入
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Ubuntu 26.04 の containerd パッケージは /etc/containerd を作らない
- name: containerd の設定ディレクトリ
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"
  become: true

- name: containerd config (v3) を配布
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  become: true
  notify: Restart containerd

- name: containerd を有効化・起動
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
  become: true

# --- kubeadm / kubelet / kubectl (pkgs.k8s.io) -------------------------------

- name: kubernetes apt リポジトリを登録(deb822 + Signed-By)
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/
    suites: /
    signed_by: https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key
  become: true
  register: k8s_prereq_repo

- name: apt キャッシュを更新
  ansible.builtin.apt:
    update_cache: true
  when: k8s_prereq_repo is changed
  become: true

- name: kubeadm / kubelet / kubectl を導入
  ansible.builtin.apt:
    name: [kubeadm, kubelet, kubectl]
    state: present
  become: true

- name: k8s パッケージを hold(更新は計画的に手動で)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubeadm, kubelet, kubectl]
  become: true

# Pod(dnsPolicy Default / CoreDNS の上流)が使う resolv.conf。ホストの resolv.conf は
# 拠点の RA/DHCP が配る DNS(v6 のみの LAN では IPv6 アドレス)になり、IPv4 しか持たない
# Pod からは届かず外部名の解決が SERVFAIL になる。wg 経由で必ず届く v4 の DNS
# (ハブの dnsmasq = <host>.wg.morino.party も引ける)と public DNS に固定する
- name: kubelet / CoreDNS 用の resolv.conf を配置
  ansible.builtin.copy:
    dest: /etc/kubernetes/resolv.conf
    content: |
      # Ansible managed: kubelet --resolv-conf(Pod / CoreDNS の上流)
      {% for ns in node_pod_dns_upstreams %}
      nameserver {{ ns }}
      {% endfor %}
    mode: "0644"
  become: true
  notify: Restart kubelet

- name: kubelet の node-ip をクラスタ用アドレスに固定(InternalIP = lan_address。Cilium の VXLAN 端点もこれになる)
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ lan_address }} --resolv-conf=/etc/kubernetes/resolv.conf
    mode: "0644"
  become: true
  notify: Restart kubelet

# --- Ingress(:80)の入口を wg0 / lo に限定 ------------------------------------------
# Cilium の ingress controller は hostNetwork で全ノードの :80 に listen する。正規の経路は
# Linode の Caddy(oauth2-proxy)→ wg0 だけなので、拠点 LAN から直接届く分は捨てる。
# 独立した nft table(Cilium / wg-quick の table は触らない)を専用 unit で入れる
- name: nftables を導入
  ansible.builtin.apt:
    name: nftables
    state: present
    cache_valid_time: 3600
  become: true
  tags: [ingress_filter]

- name: /etc/nftables.d を作成
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"
  become: true
  tags: [ingress_filter]

- name: Ingress フィルタの nft ルールを配置
  ansible.builtin.template:
    src: ingress-filter.nft.j2
    dest: /etc/nftables.d/ingress-filter.nft
    mode: "0644"
  become: true
  notify: Reload ingress filter
  tags: [ingress_filter]

- name: Ingress フィルタの unit を配置
  ansible.builtin.template:
    src: ingress-filter.service.j2
    dest: /etc/systemd/system/ingress-filter.service
    mode: "0644"
  become: true
  notify: Reload ingress filter
  tags: [ingress_filter]

- name: 配置した unit / ルールを先に反映(handler を待たない)
  ansible.builtin.meta: flush_handlers
  tags: [ingress_filter]

- name: Ingress フィルタを有効化
  ansible.builtin.systemd_service:
    name: ingress-filter
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [ingress_filter]

- name: Ingress フィルタの table が入っていることを確認
  ansible.builtin.command: nft list table inet moripa_ingress_filter
  register: k8s_prereq_ingress_filter_table
  changed_when: false
  become: true
  tags: [ingress_filter]
