# Longhorn の前提をノードに入れる(docs: https://longhorn.io/docs/1.12.1/deploy/install/#installation-requirements)
#   - ルート LV を VG の空き全部まで広げる(Ubuntu のインストーラは 100GB で止める)。
#     Longhorn のディスクはルート FS 上の longhorn_data_path(データ用 LV は作らない。
#     2026-09-12 に統合済み。OS 側の余裕は Longhorn の storageReserved で確保する)
#   - open-iscsi(iscsid を起動)、iscsi_tcp モジュール、nfs-common(RWX 用)
#   - multipathd は Longhorn のデバイスを掴んで壊すので止める(公式 KB)

- name: LVM の VG の空きを確認
  ansible.builtin.command: vgs --noheadings --units g --nosuffix -o vg_free {{ root_vg }}
  register: longhorn_prereq_vgfree
  changed_when: false
  failed_when: false
  become: true

- name: 旧データ用 LV が残っていないことを確認(残っていれば docs/admin/ansible の手順で手で統合する)
  ansible.builtin.stat:
    path: "/dev/{{ root_vg }}/data"
  register: longhorn_prereq_old_lv
  become: true

- name: 旧データ用 LV があれば止める
  ansible.builtin.fail:
    msg: "/dev/{{ root_vg }}/data が残っている。docs/admin/ansible の手順で root LV に統合してから再実行する"
  when: longhorn_prereq_old_lv.stat.exists

- name: ルート LV を VG の空き全部まで広げる(ファイルシステムも拡張)
  community.general.lvol:
    vg: "{{ root_vg }}"
    lv: "{{ root_lv }}"
    size: +100%FREE
    resizefs: true
    shrink: false
  become: true
  when:
    - longhorn_prereq_vgfree.rc == 0
    - (longhorn_prereq_vgfree.stdout | trim | float) > 1

- name: Longhorn のディスクディレクトリ
  ansible.builtin.file:
    path: "{{ longhorn_data_path }}"
    state: directory
    mode: "0755"
  become: true

- name: open-iscsi / nfs-common を導入
  ansible.builtin.apt:
    name: [open-iscsi, nfs-common]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: iscsi_tcp モジュールを常時ロード
  ansible.builtin.copy:
    dest: /etc/modules-load.d/longhorn.conf
    content: |
      iscsi_tcp
    mode: "0644"
  become: true

- name: iscsi_tcp モジュールを即時ロード
  community.general.modprobe:
    name: iscsi_tcp
    state: present
  become: true

- name: iscsid を有効化・起動
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started
  become: true

- name: multipathd を停止・無効化(Longhorn のブロックデバイスを掴ませない)
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: [multipathd.socket, multipathd.service]
  become: true
  failed_when: false
