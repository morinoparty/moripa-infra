# Linode(ハブ)上の HAProxy(L4 TCP)。tcp_routes の port を受けて対象拠点の
# 全ノードの NodePort(node_port)か、指定ホスト(hosts)の port へ wg 越しに転送する。
# minecraft_hosts はホスト名ごとに指定ノードの port か全ノードの NodePort へ(必要なら PROXY v2 付き)。
# tcp_routes が空でも HAProxy は入れておく
# (将来 Minecraft を置くときは前段の Velocity からここへ接続し、プレイヤー IP は
# modern forwarding で渡す想定)。
# 設計: docs/content/docs/architecture/wireguard.mdx(公開経路の節)

- name: tcp_routes の site が inventory のグループであることを確認
  ansible.builtin.assert:
    that:
      - item.site in groups
      - groups[item.site] | intersect(groups['k8s_cluster']) | length > 0
      # 転送先はどれか 1 つ: node_port(全ノード)/ hosts(指定ホスト)/ minecraft_hosts(ホスト名で振り分け)
      - ([item.node_port is defined, item.hosts is defined, item.minecraft_hosts is defined] | select | list | length) == 1
      - item.hosts is not defined or (item.hosts | length > 0 and item.hosts | difference(groups[item.site] | intersect(groups['k8s_cluster'])) | length == 0)
      - item.minecraft_hosts is not defined or item.minecraft_hosts | length > 0
    fail_msg: >-
      tcp_routes[{{ item.name }}]: site={{ item.site }} が inventory のグループに無いか、
      転送先の指定が不正(node_port / hosts / minecraft_hosts のどれか 1 つ。hosts は site のクラスタノード)
  loop: "{{ tcp_routes }}"
  loop_control:
    label: "{{ item.name }}"

# minecraft_hosts の各要素は host に加えて、転送先を次のどちらか 1 つだけ持つ:
#   server + port : 指定ノード(site のクラスタノード)の port
#   node_port     : site の全クラスタノードの NodePort
# send_proxy(任意)は真偽値
- name: minecraft_hosts の各要素の転送先が正しいことを確認
  ansible.builtin.assert:
    that:
      - bad == ''
    fail_msg: "tcp_routes[{{ item.name }}].minecraft_hosts の要素が不正: {{ bad }}"
  vars:
    nodes: "{{ groups[item.site] | intersect(groups['k8s_cluster']) }}"
    bad: >-
      {%- set out = [] -%}
      {%- for m in item.minecraft_hosts -%}
      {%- set by_server = m.server is defined and m.port is defined and m.node_port is not defined -%}
      {%- set by_node_port = m.node_port is defined and m.server is not defined and m.port is not defined -%}
      {%- if m.host is not defined or m.host | string | length == 0 -%}
      {%- set _ = out.append('host が無い: ' ~ m) -%}
      {%- elif not (by_server or by_node_port) -%}
      {%- set _ = out.append(m.host ~ ' は server+port か node_port のどちらか 1 つ') -%}
      {%- elif by_server and m.server not in nodes -%}
      {%- set _ = out.append(m.host ~ ' の server=' ~ m.server ~ ' が ' ~ item.site ~ ' のクラスタノードに無い') -%}
      {%- elif by_node_port and not (m.node_port | string is match('^[0-9]+$')) -%}
      {%- set _ = out.append(m.host ~ ' の node_port=' ~ m.node_port ~ ' が数値でない') -%}
      {%- elif m.send_proxy is defined and m.send_proxy is not boolean -%}
      {%- set _ = out.append(m.host ~ ' の send_proxy は true / false') -%}
      {%- endif -%}
      {%- endfor -%}
      {{- out | join(', ') -}}
  loop: "{{ tcp_routes | selectattr('minecraft_hosts', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

# HAProxy は handshake をホスト名で部分一致させるので、ある host が別の host を含むと
# 先に書いた方に吸われる(対応表は sops 暗号化なので check-consistency では見られない)。
# minecraft_hosts は minecraft_hosts_public と sops の表を連結したものなので、両方をまとめて見る。
# backend 名は host の英数字と "-" 以外を "_" にしたものなので、それも重複しないこと
- name: minecraft_hosts の host が重複せず、互いを含まないことを確認
  ansible.builtin.assert:
    that:
      - names | length == names | unique | length
      - backends | length == backends | unique | length
      - conflicts == ''
    fail_msg: "tcp_routes[{{ item.name }}].minecraft_hosts の host(または backend 名)が重複しているか、別の host を含んでいる: {{ conflicts }}"
  vars:
    names: "{{ item.minecraft_hosts | map(attribute='host') | list }}"
    backends: "{{ names | map('regex_replace', '[^A-Za-z0-9-]', '_') | list }}"
    conflicts: >-
      {%- set out = [] -%}
      {%- for x in names -%}{%- for y in names -%}
      {%- if x != y and x in y -%}{%- set _ = out.append(x ~ ' in ' ~ y) -%}{%- endif -%}
      {%- endfor -%}{%- endfor -%}
      {{- out | join(', ') -}}
  loop: "{{ tcp_routes | selectattr('minecraft_hosts', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: HAProxy を導入
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: haproxy.cfg を配布
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: haproxy -c -f %s
  become: true
  notify: Reload haproxy

- name: HAProxy を有効化・起動
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started
  become: true
