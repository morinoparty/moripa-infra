# ハブ上の dnsmasq。wg 内のホスト名(<host>.<wg_dns_domain>)を wg アドレスに解決する。
# wg0 でのみ listen し(bind-dynamic で wg0 の出現に追従)、nftables も wg0 からの 53 番だけ通す。
# systemd-resolved(127.0.0.53)とは listen アドレスが異なるため共存できる

- name: dnsmasq と dig を導入
  ansible.builtin.apt:
    name: [dnsmasq, bind9-dnsutils]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# ubuntu-fan(dnsmasq の推奨依存で入る)の bind-interfaces は wg.conf の
# bind-dynamic と排他で、restart 時に dnsmasq が起動不能になる。
# fan networking は未使用なので設定を空に上書きして無効化する
# (削除だと apt が conffile を再配置しうる。変更済み conffile は保持される)
- name: ubuntu-fan の dnsmasq 設定を無効化
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/ubuntu-fan
    content: |
      # Ansible managed(手で編集しない)
      # fan networking は未使用。bind-interfaces が wg.conf の bind-dynamic と
      # 衝突して dnsmasq が起動不能になるため無効化している
    mode: "0644"
  become: true
  notify: Restart dnsmasq

- name: dnsmasq の wg 用設定を配布
  ansible.builtin.template:
    src: wg.conf.j2
    dest: /etc/dnsmasq.d/wg.conf
    owner: root
    group: root
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  become: true
  notify: Restart dnsmasq

- name: dnsmasq を有効化・起動
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: true
    state: started
  become: true

- name: handler を先に反映
  ansible.builtin.meta: flush_handlers

- name: ゲートウェイ名が解決できることを確認
  ansible.builtin.command: dig +short @{{ wg_hub_address }} {{ wg_dns_gateway_alias }}.{{ wg_dns_domain }}
  register: wg_dns_check
  changed_when: false
  failed_when: wg_dns_check.stdout.strip() != wg_hub_address
