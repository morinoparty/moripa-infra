# ハブ上の dnsmasq。wg 内のホスト名(<host>.<wg_dns_domain>)を wg アドレスに解決する。
# wg0 でのみ listen し(bind-dynamic で wg0 の出現に追従)、nftables も wg0 からの 53 番だけ通す。
# systemd-resolved(127.0.0.53)とは listen アドレスが異なるため共存できる

- name: dnsmasq と dig を導入
  ansible.builtin.apt:
    name: [dnsmasq, bind9-dnsutils]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: dnsmasq の wg 用設定を配布
  ansible.builtin.template:
    src: wg.conf.j2
    dest: /etc/dnsmasq.d/wg.conf
    owner: root
    group: root
    mode: "0644"
    validate: dnsmasq --test --conf-file=%s
  become: true
  notify: Restart dnsmasq

- name: dnsmasq を有効化・起動
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: true
    state: started
  become: true

- name: handler を先に反映
  ansible.builtin.meta: flush_handlers

- name: ゲートウェイ名が解決できることを確認
  ansible.builtin.command: dig +short @{{ wg_hub_address }} {{ wg_dns_gateway_alias }}.{{ wg_dns_domain }}
  register: wg_dns_check
  changed_when: false
  failed_when: wg_dns_check.stdout.strip() != wg_hub_address
