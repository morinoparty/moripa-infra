# restart ではなく syncconf で反映する:
# wg-quick@wg0 を restart すると自分の管理セッションや Caddy / HAProxy 経由の
# 既存接続まで切れる。Interface 行(Address/MTU/PostUp)を変更した場合のみ、
# 計画的に手動 restart すること(docs/content/docs/architecture/wireguard.mdx)。
- name: Sync WireGuard config
  ansible.builtin.shell: >-
    set -o pipefail;
    wg syncconf {{ wg_interface }} <(wg-quick strip {{ wg_interface }})
  args:
    executable: /bin/bash
  become: true

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
  become: true
