# spoke の疎通・経路健全性チェック(handler 反映後に実行)。
# LAN 直通の検証(他ノードへの ping / 経路)は roles/cluster_lan が
# 第 2 サブネットを付けた後に行う
- name: handler を先に反映
  ansible.builtin.meta: flush_handlers

- name: hub へ ping(トンネル疎通)
  ansible.builtin.command: ping -c 2 -W 3 {{ wg_hub_address }}
  changed_when: false
  become: true

- name: main テーブル除外の ip rule が存在することを確認
  ansible.builtin.command: ip rule show priority 200
  register: wireguard_rule_check
  changed_when: false
  failed_when: >-
    cluster_lan_cidr not in wireguard_rule_check.stdout
    or pod_cidr not in wireguard_rule_check.stdout
    or service_cidr not in wireguard_rule_check.stdout
