# Minecraft サーバーの雛形。実運用の設定(メモリ、プラグイン、ワールドの
# バックアップ等)は導入時に詰めること。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # DNAT 先ノードにピン(eTP Local のため必須)。
      # フェイルオーバー時は network.yml の dnat_rules と合わせて変更する
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: MEMORY
              value: 4G
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 6Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # ストレージクラスは導入時に決定(local-path-provisioner 等)
        resources:
          requests:
            storage: 20Gi
