# Cilium の共通設定(全拠点共通のベース)。
# サイト固有の値(k8sServiceHost = その拠点の kube-vip VIP)は
# kubernetes/sites/<site>/infrastructure/cilium/values.yaml が上書きする。
# Ansible (roles/k8s_bootstrap/tasks/cilium.yml) は helm -f を common → site の順で、
# ArgoCD (各 site の applications/cilium.yaml) も valueFiles を同じ順で読む。
# ansible/group_vars と一致すること(assert + make check-consistency で検査)。
# Jinja テンプレート化は禁止(静的 YAML を保つ)。

kubeProxyReplacement: true
k8sServicePort: 6443

routingMode: tunnel
tunnelProtocol: vxlan

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

# NodePort / hostNetwork のトラフィックを受ける NIC。
# "e+" は LAN NIC のプレフィックスマッチ(enp*/eno*/eth*)。ノードの InternalIP
# (lan_address)と VXLAN はここ。wg0 は Linode の Caddy / HAProxy からの転送が
# 着信するので必須。NIC 名確定後は実名に置換推奨
devices:
  - e+
  - wg0

# ベース MTU を明示(wg0 の小さい MTU を最小値として誤検出させない)。
# ノード間の VXLAN は LAN 直通(1500)なので Pod MTU は 1500 - 50 = 1450。
# 南北 egress の wg 経由分はハブ側の MSS clamp で救済する(docs/content/docs/architecture/wireguard.mdx)
MTU: 1500

# Kubernetes Ingress(Cilium 内蔵の ingress controller)。Gateway API は使わない
# (同じ cilium-envoy が :80 を取り合うので併用不可。Ingress の方が Headlamp などの
# UI からも扱いやすい)。IngressClass "cilium" は chart が作る
ingressController:
  enabled: true
  # kubeadm クラスタには既定 IngressClass が無いので cilium を既定にする
  # (各 Ingress にも ingressClassName: cilium を明示する)
  default: true
  # 全 Ingress を 1 つの Envoy listener で受ける
  loadbalancerMode: shared
  # TLS は Linode の Caddy が終端するので HTTP → HTTPS の強制リダイレクトはしない
  enforceHttps: false
  service:
    # hostNetwork で受けるので LoadBalancer は不要(LB IPAM も無い)
    type: ClusterIP
  # Envoy が全ノードの :80 に直接 listen し、Linode 上の Caddy(リバースプロキシ)
  # からの転送を wg0 で受ける。外部から :80 へは Caddy 経由でしか届かない
  # (Cloud Firewall + nftables)。LAN 内のホストからは直接 :80 に届くので、
  # LAN は信頼する前提。Ingress には Gateway API の xffNumTrustedHops 相当が無く、
  # Envoy は X-Forwarded-For にハブの wg アドレス(10.100.0.1)を追記するので、
  # クライアント実IPが要るアプリは XFF の先頭を読むこと
  hostNetwork:
    enabled: true
    sharedListenerPort: 80

envoy:
  securityContext:
    capabilities:
      keepCapNetBindService: true
      # chart 既定の NET_ADMIN + SYS_ADMIN(BPF datapath 連携に必須。無いと envoy が
      # "CAP_NET_ADMIN and either CAP_SYS_ADMIN or CAP_BPF ... needed" で CrashLoop)に、
      # hostNetwork で :80 を bind するための NET_BIND_SERVICE を足す
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

operator:
  replicas: 2
