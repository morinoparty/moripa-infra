# Cilium の共通設定(全拠点共通のベース)。
# サイト固有の値(k8sServiceHost = その拠点の kube-vip VIP)は
# kubernetes/sites/<site>/infrastructure/cilium/values.yaml が上書きする。
# Ansible (roles/k8s_bootstrap/tasks/cilium.yml) は helm -f を common → site の順で、
# ArgoCD (各 site の applications/cilium.yaml) も valueFiles を同じ順で読む。
# ansible/group_vars と一致すること(assert + make check-consistency で検査)。
# Jinja テンプレート化は禁止(静的 YAML を保つ)。

kubeProxyReplacement: true
k8sServicePort: 6443

routingMode: tunnel
tunnelProtocol: vxlan

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

# NodePort / hostNetwork のトラフィックを受ける NIC。
# "e+" は LAN NIC のプレフィックスマッチ(enp*/eno*/eth*)。ノードの InternalIP
# (lan_address)と VXLAN はここ。wg0 は Linode の Caddy / HAProxy からの転送が
# 着信するので必須。NIC 名確定後は実名に置換推奨
devices:
  - e+
  - wg0

# ベース MTU を明示(wg0 の小さい MTU を最小値として誤検出させない)。
# ノード間の VXLAN は LAN 直通(1500)なので Pod MTU は 1500 - 50 = 1450。
# 南北 egress の wg 経由分はハブ側の MSS clamp で救済する(docs/content/docs/architecture/wireguard.mdx)
MTU: 1500

gatewayAPI:
  enabled: true
  # Envoy が全ノードの :80 に直接 listen し、Linode 上の Caddy(リバースプロキシ)
  # からの転送を wg0 で受ける。TLS は Caddy が終端するので listener は HTTP のみ
  hostNetwork:
    enabled: true
  # Caddy が付ける X-Forwarded-For の右端 1 ホップ(= Caddy)を信頼し、
  # クライアント実IPをアプリへ渡す。外部から :80 へは Caddy 経由でしか届かない
  # (Cloud Firewall + nftables)ため、外部からの偽装 XFF は混入しない
  # (LAN 内のホストからは直接 :80 に届くので、LAN は信頼する前提)
  xffNumTrustedHops: 1

envoy:
  securityContext:
    capabilities:
      keepCapNetBindService: true
      # chart 既定の NET_ADMIN + SYS_ADMIN(BPF datapath 連携に必須。無いと envoy が
      # "CAP_NET_ADMIN and either CAP_SYS_ADMIN or CAP_BPF ... needed" で CrashLoop)に、
      # hostNetwork で :80 を bind するための NET_BIND_SERVICE を足す
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

operator:
  replicas: 2
