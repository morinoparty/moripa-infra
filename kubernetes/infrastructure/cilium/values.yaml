# Cilium の唯一の設定ファイル。
# Ansible (roles/k8s_bootstrap/tasks/cilium.yml) が helm -f で使い、
# ArgoCD (bootstrap/applications/cilium.yaml) が multi-source $values で同じものを読む。
# ansible/group_vars/all/network.yml と一致すること(assert + make check-consistency で検査)。
# Jinja テンプレート化は禁止(静的 YAML を保つ)。

kubeProxyReplacement: true
# kube-vip の VIP(kube-proxy 不在でも API へ到達するための直指定)
k8sServiceHost: 192.168.10.10
k8sServicePort: 6443

routingMode: tunnel
tunnelProtocol: vxlan

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

# NodePort / hostNetwork のトラフィックを受ける NIC。
# wg0 必須(Linode からの DNAT は wg0 に着信する)。
# "e+" は LAN NIC のプレフィックスマッチ(enp*/eno*/eth*)。NIC 名確定後は実名に置換推奨
devices:
  - e+
  - wg0

# ベース MTU を明示(wg0 の 1420 を最小値として誤検出させない)。
# VXLAN の Pod MTU は 1500 - 50 = 1450。
# 南北 egress の wg 経由分はハブ側の MSS clamp で救済する(docs/wireguard.md)
MTU: 1500

gatewayAPI:
  enabled: true
  # Envoy がノードの :80/:443 に直接 listen し、Linode の DNAT を
  # NodePort 変換なし(= クライアント実IP保持)で受ける
  hostNetwork:
    enabled: true

envoy:
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - NET_BIND_SERVICE

operator:
  replicas: 2
