# Hermes のダッシュボード。認証は oauth2-proxy(private ホスト)+ Hermes 自身の basic 認証の二段
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-dashboard
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: ingress
  hostnames:
    - hermes.site1.private.dev.morino.party
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hermes
          port: 9119
          weight: 1
