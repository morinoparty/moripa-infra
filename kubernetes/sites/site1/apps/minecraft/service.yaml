# 公開経路: [プレイヤー] → Velocity(別拠点) → Linode HAProxy :25565 →
# site1 の各ノードの NodePort 30565 → Pod。
# L4 では実IPが届かないため externalTrafficPolicy は Cluster(どのノードで
# 受けても Pod へ転送される。ノードにピンしない)。プレイヤー IP は Velocity の
# modern forwarding で渡す(Paper 側で proxies.velocity を有効にすること)。
apiVersion: v1
kind: Service
metadata:
  name: minecraft
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      nodePort: 30565  # network.yml の tcp_routes(minecraft.node_port)と一致させる
