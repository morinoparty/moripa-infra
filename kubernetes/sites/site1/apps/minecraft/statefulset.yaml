# Minecraft サーバーの雛形。実運用の設定(メモリ、プラグイン、ワールドの
# バックアップ等)は導入時に詰めること。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
spec:
  serviceName: minecraft
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # ノードにはピンしない(HAProxy が両ノードの NodePort へ振るため)。
      # ただし local-path 等のノードローカルストレージを使う場合は PVC で
      # 実質ピンされる。Velocity 配下なので online-mode=false + modern forwarding
      # (Paper の config/paper-global.yml: proxies.velocity)を有効にすること
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          env:
            - name: EULA
              value: "TRUE"
            - name: MEMORY
              value: 4G
          ports:
            - containerPort: 25565
              name: minecraft
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              memory: 6Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # ストレージクラスは導入時に決定(local-path-provisioner 等)
        resources:
          requests:
            storage: 20Gi
