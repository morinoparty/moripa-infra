# ワールドの入口: moripa-worlds の proxy サブコマンド(Minekube Gate v0.74.32 をライブラリとして組み込み、
# classic モードで動かす。github.com/morinoparty/moripa-worlds)。
# ハブの HAProxy が "<uuidv7>.world.site1.dev.morino.party" を含む handshake を PROXY protocol v2 付きで
# 全ノードの NodePort 30565 へ送り(network.yml の minecraft_hosts_public)、Gate が:
#   1. Mojang の認証(onlineMode)と 26.3(protocol 777)の確認をする
#   2. moripa-worlds(コントローラ)の HTTP API にワールドの状態を聞き、Ready なら w-<uuid> へ直接、
#      まだなら起動を頼んで待合ロビー(lobby.yaml)へ入れ、Ready になったら w-<uuid> へ移す
# ワールド・ロビーへは Velocity modern forwarding で繋ぐ(秘密は Secret worlds-forwarding)。
# Gate 自体は Kubernetes の権限も S3 のキーも持たない(コントローラとは API だけで話す)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-config
  labels:
    app.kubernetes.io/name: gate
data:
  # 書式は Gate v0.74.32 の pkg/edition/java/config。forwarding.velocitySecret はここに書かない
  # (proxy が環境変数 FORWARDING_SECRET から起動前に差し込む。無ければ起動しない)
  config.yml: |
    # ファイルの書き換えを監視して読み直す機能を切る(Gate v0.74.32 は既定で有効)。velocitySecret は
    # 起動時にメモリ上で差し込むだけなので、ConfigMap の更新で読み直すと秘密の無い設定が当たってしまう。
    # proxy 側も gate.Start に WithAutoConfigReload を渡さない
    noAutoReload: true
    config:
      bind: 0.0.0.0:25565
      # 認証は Gate が行う(ワールド・ロビーは forwarding の秘密を持つ接続しか受けず、自分では認証しない)
      onlineMode: true
      # ハブの HAProxy が付ける PROXY protocol v2 を読む(Gate のログ・接続数制限が実 IP になる)。
      # 信頼する送信元は既定(127/8・10/8・172.16/12・192.168/16 等の private)のまま。
      # NodePort 経由だと送信元はハブの wg アドレスか、Cilium が SNAT したノードのアドレスに
      # なり、どちらも 10/8。ヘッダは「信頼する送信元なら任意」で、無しの接続も通る
      # (拠点 LAN から NodePort を直接叩いても、HAProxy 経由と同じことしかできない)
      proxyProtocol: true
      forwarding:
        mode: velocity
      # ロビーだけを静的に置く。w-<uuid> は proxy がワールドの Ready を確かめてから登録する
      servers:
        lobby: lobby.worlds.svc.cluster.local:25565
      # 初期サーバーは proxy の PlayerChooseInitialServerEvent が決める(try で勝手に繋がない)
      try: []
      # 全員が同じ Gate を共有し、w-<uuid> も同じ一覧に登録されるので、/server で他人のワールドへ
      # 移れないよう組み込みコマンドは切る
      builtinCommands: false
      announceProxyCommands: false
      # v0.74.32 の classic モードは connectionTimeout / readTimeout を使う所でもう一度 time.Millisecond 倍する
      # (configutil.Duration は既にナノ秒)。既定の 5s / 30s のままだと桁あふれして実質無期限になり、応答しない
      # バックエンドへの接続や handshake だけ送って黙るクライアントが居座る。ナノ秒で書いて Gate が掛けた後に
      # 5 秒 / 30 秒になるようにする(proxy は実効値が 1 秒〜10 分に収まらない設定では起動しない)
      connectionTimeout: 5000ns
      readTimeout: 30000ns
      # BungeeCord の plugin message(Connect でサーバーを移る等)は使わない。Connect は上の値を倍せずに使い
      # 5µs で必ず失敗するうえ、組み込みコマンドと同じく他人のワールドへ移る口になる(proxy も強制で切る)
      bungeePluginChannelEnabled: false
      lite:
        enabled: false
      via:
        enabled: false
      # サーバーリストの MOTD は proxy の PingEvent がワールドごとに書き換える
      status:
        motd: "§7morino.party worlds"
        showMaxPlayers: 200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate
  labels:
    app.kubernetes.io/name: gate
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate
      annotations:
        # gate-config は起動時に読むだけ(noAutoReload)。変えたらこの値を上げて Pod を作り直す
        worlds.morino.party/gate-config-rev: "4"
    spec:
      enableServiceLinks: false
      # Kubernetes API は使わない(コントローラとは HTTP API だけで話す)
      automountServiceAccountToken: false
      # 2 台を別ノードへ(1 台落ちても HAProxy → NodePort → 残りの Gate で受けられる)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gate
      securityContext:
        # distroless の nonroot
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # 待合中のプレイヤーは Pod が消えると切断される。ロビー・ワールドにいるプレイヤーも同じ
      terminationGracePeriodSeconds: 30
      containers:
        - name: gate
          # タグ・ダイジェストは kustomization.yaml の images で moripa-worlds.yaml と同じ値に固定する
          # (proxy と controller の API がずれないよう、1 か所でまとめて上げる)
          image: ghcr.io/morinoparty/moripa-worlds
          imagePullPolicy: IfNotPresent
          args: [proxy]
          env:
            # Gate の設定ファイル(gate-config)。secret は proxy が FORWARDING_SECRET から差し込む
            - name: GATE_CONFIG
              value: /etc/gate/config.yml
            # Velocity modern forwarding の秘密(ワールド・ロビーの IANUA_VELOCITY_SECRET と同じ値)
            - name: FORWARDING_SECRET
              valueFrom:
                secretKeyRef:
                  name: worlds-forwarding
                  key: secret
            # コントローラの API(/v1/worlds/...)
            - name: API_URL
              value: http://moripa-worlds.worlds.svc.cluster.local:8080
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moripa-worlds-api
                  key: token
            # このサフィックスの前の部分がワールド ID(UUIDv7、小文字)
            - name: WORLD_HOST_SUFFIX
              value: ".world.site1.dev.morino.party"
            # ワールド・ロビー(ianua-silvae)が話せるのは Minecraft 26.3 だけ
            - name: REQUIRED_PROTOCOL
              value: "777"
            - name: REQUIRED_VERSION_NAME
              value: "26.3"
            # 待合の上限。コントローラの STARTUP_TIMEOUT と揃える
            - name: STARTUP_WAIT
              value: 5m
            - name: LISTEN_HTTP
              value: ":8080"
            - name: LOG_LEVEL
              value: info
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - name: minecraft
              containerPort: 25565
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # /healthz は HTTP サーバーが立てば返るので、Minecraft のポートが開くまでは tcpSocket で見る
          readinessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # classic モードはプレイヤーごとに暗号化・圧縮を行うので Lite より使う
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gate
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gate-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gate
  labels:
    app.kubernetes.io/name: gate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate
---
# ハブの HAProxy(tcp_routes の minecraft → minecraft_hosts_public)が全クラスタノードの wg アドレス:30565 へ送る。
# externalTrafficPolicy は Cluster(どのノードに着いても Gate へ届く。HAProxy が全ノードへ振るため)
apiVersion: v1
kind: Service
metadata:
  name: gate
  labels:
    app.kubernetes.io/name: gate
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: gate
  ports:
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: minecraft
      nodePort: 30565
