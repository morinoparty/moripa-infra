apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: worlds
resources:
  - gate.yaml
  - moripa-worlds.yaml
  - networkpolicy.yaml
# moripa-worlds が RustFS(S3)を読むためのキー(Secret moripa-worlds-s3)は sops で暗号化した
# secrets.sops.yaml を ksops が復号して投入する(ローカルの kubectl kustomize ではビルドできない)。
# 同じキーを RustFS 側にもユーザーとして登録する(バケット moripa-utils の schematics/ だけ)
generators:
  - secret-generator.yaml
