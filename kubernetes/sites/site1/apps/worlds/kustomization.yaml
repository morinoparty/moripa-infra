apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: worlds
resources:
  - gate.yaml
  - lobby.yaml
  - moripa-worlds.yaml
  - networkpolicy.yaml
  - prepull.yaml
# 秘密は sops で暗号化した secrets.sops.yaml を ksops が復号して投入する(ローカルの kubectl kustomize ではビルドできない):
#   moripa-worlds-s3  : moripa-worlds が RustFS(S3)を読むためのキー。同じキーを RustFS 側にもユーザーとして
#                       登録する(バケット moripa-utils の schematics/ だけ)
#   worlds-forwarding : Gate → ワールド / ロビーの Velocity modern forwarding の秘密
#   moripa-worlds-api : Gate → コントローラの API の Bearer トークン
# moripa-worlds のイメージ(gate.yaml の proxy と moripa-worlds.yaml の controller)はここだけで固定する。
# 両方が同じビルドを使い、proxy ↔ controller の API がずれない。更新は新しい sha-<short> のダイジェストを
# docker buildx imagetools inspect ghcr.io/morinoparty/moripa-worlds:sha-<short> で調べて書き換える。
# proxy / controller サブコマンドを持つのは sha-5f86085 以降(それより前の waker 版に戻すと両方 CrashLoop する)
images:
  - name: ghcr.io/morinoparty/moripa-worlds
    newTag: sha-d9884e6
    digest: sha256:2a9fba86e7446e61f3fe18dc20e02f68e213fa137e83ffb923a65dfb72fa14bc
  # ianua-silvae(lobby・prepull・ワールド)。ワールドの WORLD_IMAGE には下の replacements で同じ値が入る
  - name: ghcr.io/morinoparty/ianua-silvae
    newTag: main
    digest: sha256:9f505aa2dca72b8b85f8a3d91ffab34dc54e8fe877f4a37f0e649014fbe50bec
replacements:
  - source:
      kind: Deployment
      name: lobby
      fieldPath: spec.template.spec.containers.[name=server].image
    targets:
      - select:
          kind: Deployment
          name: moripa-worlds
        fieldPaths:
          - spec.template.spec.containers.[name=moripa-worlds].env.[name=WORLD_IMAGE].value
generators:
  - secret-generator.yaml
