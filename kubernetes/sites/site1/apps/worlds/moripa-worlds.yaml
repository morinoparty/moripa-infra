# moripa-worlds(github.com/morinoparty/moripa-worlds): ワールドの起動係 兼 掃除係。
#   - waker   : Gate が w-<uuid> に繋げなかった接続を :25565 で受け、RustFS の
#               schematics/<uuid>/info.json を見てワールド(ConfigMap / Deployment / Service w-<uuid>)を作る。
#               サーバーリストの ping でも起動する
#   - reaper  : 起動しないもの(STARTUP_TIMEOUT)、無人が IDLE_TIMEOUT 続いたもの、info.json が消えた /
#               delete_at を過ぎたものを消す
#   - sweeper : delete_at を過ぎた schematic を RustFS から消す(MoripaUtils 自身は消さない)
# w-<uuid> はこのコントローラだけが作る(git には無い。worlds-app.yaml の prune の注記参照)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
---
# worlds namespace の中だけ。w-<uuid> の 3 種を作って消す + Pod の状態を見る
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moripa-worlds
subjects:
  - kind: ServiceAccount
    name: moripa-worlds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
spec:
  # reaper / sweeper を二重に走らせない(作成・削除は冪等だが MAX_WORLDS の数え方がずれる)
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moripa-worlds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moripa-worlds
    spec:
      serviceAccountName: moripa-worlds
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: moripa-worlds
          # TODO: 最初の publish 後にダイジェストで固定する(main は動くタグ)
          image: ghcr.io/morinoparty/moripa-worlds:main
          imagePullPolicy: Always
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # このサフィックスの前の部分がワールド ID(UUIDv7、小文字)
            - name: WORLD_HOST_SUFFIX
              value: ".world.site1.dev.morino.party"
            - name: LISTEN_MINECRAFT
              value: ":25565"
            - name: LISTEN_HTTP
              value: ":8080"
            # RustFS(namespace rustfs、Service rustfs-svc の :9000 が S3)。
            # path-style 固定。キーは schematics/* の Get/Delete とバケットの List だけ
            - name: S3_ENDPOINT
              value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: moripa-utils
            - name: S3_PREFIX
              value: schematics/
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: moripa-worlds-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: moripa-worlds-s3
                  key: AWS_SECRET_ACCESS_KEY
            # ワールドのサーバー(github.com/morinoparty/ianua-silvae)。
            # TODO: 最初の publish 後に ghcr.io/morinoparty/ianua-silvae:<tag>@sha256:… で固定する
            - name: WORLD_IMAGE
              value: ghcr.io/morinoparty/ianua-silvae:main
            # schematic を読み取り専用で見せる PVC(csi-s3 / geesefs で moripa-utils/schematics をマウント)
            - name: WORLD_SCHEMATICS_PVC
              value: schematics
            - name: WORLD_ORIGIN_Y
              value: "64"
            - name: WORLD_MEMORY_REQUEST
              value: 384Mi
            - name: WORLD_MEMORY_LIMIT
              value: 768Mi
            # 同時に動かすワールドの上限(w-* の Deployment の数)。超えたら「混み合っています」
            - name: MAX_WORLDS
              value: "6"
            - name: IDLE_TIMEOUT
              value: 10m
            - name: STARTUP_TIMEOUT
              value: 3m
            - name: SWEEP_INTERVAL
              value: 1h
            - name: DELETE_EXPIRED
              value: "true"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: minecraft
              containerPort: 25565
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # S3 に届き、informer が同期済みになってから受ける
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
# Gate の 2 番目の backend(moripa-worlds.worlds.svc.cluster.local:25565)と、Prometheus の /metrics
apiVersion: v1
kind: Service
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
spec:
  selector:
    app.kubernetes.io/name: moripa-worlds
  ports:
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: minecraft
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
# kube-prometheus-stack はラベル無しの ServiceMonitor も拾う(monitoring/values.yaml の
# serviceMonitorSelectorNilUsesHelmValues: false)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: moripa-worlds
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
