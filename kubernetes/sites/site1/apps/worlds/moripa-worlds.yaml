# moripa-worlds(github.com/morinoparty/moripa-worlds)の controller サブコマンド: ワールドの起動係 兼 掃除係。
#   - API     : Gate(proxy サブコマンド、gate.yaml)だけが叩く HTTP API(:8080 の /v1/worlds/<uuid>)。
#               RustFS の schematics/<uuid>/info.json を見て状態を返し、ensure でワールド
#               (ConfigMap / Deployment / Service w-<uuid>)を作る。Bearer トークン(Secret moripa-worlds-api)必須。
#               同時起動数(MAX_WORLDS)と作成のレート制限はここだけが持つ
#   - reaper  : 起動しないもの(STARTUP_TIMEOUT)、無人が IDLE_TIMEOUT 続いたもの、info.json が消えた /
#               delete_at を過ぎたものを消す
#   - sweeper : delete_at を過ぎた schematic を RustFS から消す(MoripaUtils 自身は消さない)
# w-<uuid> はこのコントローラだけが作る(git には無い。worlds-app.yaml の prune の注記参照)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
---
# worlds namespace の中だけ。w-<uuid> の 3 種を作って消す + Pod の状態を見る
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moripa-worlds
subjects:
  - kind: ServiceAccount
    name: moripa-worlds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
spec:
  # reaper / sweeper を二重に走らせない(作成・削除は冪等だが MAX_WORLDS の数え方がずれる)
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moripa-worlds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moripa-worlds
    spec:
      serviceAccountName: moripa-worlds
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: moripa-worlds
          # morinoparty/moripa-worlds の main(118169c)をダイジェストで固定。更新は新しい sha-<short> の
          # ダイジェストに書き換えて push する(docker buildx imagetools inspect ghcr.io/morinoparty/moripa-worlds:sha-<short>)
          # TODO: controller / proxy サブコマンドを含むイメージを publish したら gate.yaml と同じダイジェストに上げる
          #   (118169c は旧 waker 版で、args の controller を知らない)
          image: ghcr.io/morinoparty/moripa-worlds:sha-118169c@sha256:92d6398a68450be872634c6bf6b1e8cb714b7a4ac494ad85479fb48b38b2e2d3
          imagePullPolicy: IfNotPresent
          args: [controller]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # このサフィックスの前の部分がワールド ID(UUIDv7、小文字)
            - name: WORLD_HOST_SUFFIX
              value: ".world.site1.dev.morino.party"
            - name: LISTEN_HTTP
              value: ":8080"
            # /v1/* の Bearer トークン(gate.yaml の API_TOKEN と同じ Secret)
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moripa-worlds-api
                  key: token
            # ワールドの Pod に IANUA_VELOCITY_SECRET として渡す Secret(キー secret)。
            # ワールドは Gate からの forwarding 付きの接続しか受けず、自分では認証しない
            - name: FORWARDING_SECRET_NAME
              value: worlds-forwarding
            # RustFS(namespace rustfs、Service rustfs-svc の :9000 が S3)。
            # path-style 固定。キーは schematics/* の Get/Delete とバケットの List だけ
            - name: S3_ENDPOINT
              value: "http://rustfs-svc.rustfs.svc.cluster.local:9000"
            - name: S3_REGION
              value: us-east-1
            - name: S3_BUCKET
              value: moripa-utils
            - name: S3_PREFIX
              value: schematics/
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: moripa-worlds-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: moripa-worlds-s3
                  key: AWS_SECRET_ACCESS_KEY
            # ワールドのサーバー(github.com/morinoparty/ianua-silvae)。
            # TODO: 最初の publish 後に ghcr.io/morinoparty/ianua-silvae:<tag>@sha256:… で固定する
            - name: WORLD_IMAGE
              value: ghcr.io/morinoparty/ianua-silvae:main
            # schematic を読み取り専用で見せる PVC(csi-s3 / geesefs で moripa-utils/schematics をマウント)
            - name: WORLD_SCHEMATICS_PVC
              value: schematics
            - name: WORLD_ORIGIN_Y
              value: "64"
            - name: WORLD_MEMORY_REQUEST
              value: 384Mi
            - name: WORLD_MEMORY_LIMIT
              value: 768Mi
            # 同時に動かすワールドの上限(w-* の Deployment の数。lobby は数えない)。超えたら「混み合っています」
            - name: MAX_WORLDS
              value: "6"
            - name: IDLE_TIMEOUT
              value: 10m
            # イメージの pull + schematic 待ちの init コンテナ(最大 120 秒)+ JVM 起動が収まる長さ。
            # Gate の STARTUP_WAIT(ロビーで待たせる上限)と揃える
            - name: STARTUP_TIMEOUT
              value: 5m
            # 起動後に一度も参加されないワールド(ログインして戻らなかった等)を早めに片付ける
            - name: UNJOINED_TIMEOUT
              value: 3m
            - name: SWEEP_INTERVAL
              value: 1h
            - name: DELETE_EXPIRED
              value: "true"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # S3 に届き、informer が同期済みになってから受ける
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
# Gate からの API(/v1/*)と、Prometheus の /metrics
apiVersion: v1
kind: Service
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
spec:
  selector:
    app.kubernetes.io/name: moripa-worlds
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
# kube-prometheus-stack はラベル無しの ServiceMonitor も拾う(monitoring/values.yaml の
# serviceMonitorSelectorNilUsesHelmValues: false)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: moripa-worlds
  labels:
    app.kubernetes.io/name: moripa-worlds
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: moripa-worlds
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
