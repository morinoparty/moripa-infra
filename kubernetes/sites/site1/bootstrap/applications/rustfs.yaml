# RustFS(S3 互換オブジェクトストレージ、standalone + Longhorn)。
# chart は charts.rustfs.com、values / Ingress / 固定 ClusterIP の Service / プロビジョニング Job /
# root 鍵(sops)は git。S3 は公開ホスト、コンソールは private ホスト(oauth2-proxy)。
# targetRevision は ansible/group_vars/all/versions.yml の rustfs_chart_version と
# 一致させること(make check-consistency で検査)。
# prune: false — データの PVC(rustfs-data)が prune で消えると実データを失うため
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.rustfs.com
      chart: rustfs
      targetRevision: 1.0.1
      helm:
        releaseName: rustfs
        valueFiles:
          - $values/kubernetes/sites/site1/infrastructure/rustfs/values.yaml
    - repoURL: https://github.com/morinoparty/moripa-infra.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/morinoparty/moripa-infra.git
      targetRevision: main
      path: kubernetes/sites/site1/infrastructure/rustfs
  destination:
    server: https://kubernetes.default.svc
    namespace: rustfs
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
