# Longhorn(分散ブロックストレージ、既定 StorageClass)。
# multi-source: chart は charts.longhorn.io、values と Ingress は git。
# targetRevision は ansible/group_vars/all/versions.yml の longhorn_version と
# 一致させること(make check-consistency で検査)。
# prune: false — CRD/ボリュームが prune で消えると実データを失うため
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.1
      helm:
        releaseName: longhorn
        valueFiles:
          - $values/kubernetes/sites/site1/infrastructure/storage/longhorn-values.yaml
    - repoURL: https://github.com/morinoparty/moripa-infra.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/morinoparty/moripa-infra.git
      targetRevision: main
      path: kubernetes/sites/site1/infrastructure/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
