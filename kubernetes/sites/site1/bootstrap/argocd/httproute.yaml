# ArgoCD UI / CLI(https://argocd.site1.dev.morino.party)。ArgoCD 自身のログインがあるので
# 公開側(dev)のホスト名で出す。Gateway `public` は ingress Application が作るため、
# bootstrap 直後は Gateway が現れるまで未接続のまま待つ
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  # group/kind/matches/weight は API の既定値。省略すると ArgoCD の diff が
  # 常に OutOfSync になるので明示する
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: ingress
  hostnames:
    - argocd.site1.dev.morino.party
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
