# PVC schematics(schematics.yaml)を置く namespace worlds はこの Application(sync-wave 1)が先に作る。
# worlds の Application(apps 配下、wave 2)が同期される前に PVC を作ろうとして namespace 不在で
# 失敗すると、自動 sync は同じリビジョンを再試行しないので csi-s3 が詰まる。
# worlds の Application の CreateNamespace=true は「無ければ作る」だけで追跡ラベルを付けない
# (所有しない)ので、併用しても衝突しない。
# Prune=false: このファイルを消しても namespace ごと worlds のリソースが消えないように
# Pod Security Admission は restricted を強制する。moripa-worlds はインターネットから届く handshake を
# 読みつつ、この namespace の Deployment を作れる(Role に resourceNames は付けられない)ので、
# 乗っ取られても privileged / hostPath / hostNetwork の Pod でノードへ抜けられないようにする。
# gate・moripa-worlds・w-<uuid>(ianua-silvae と init の busybox)はどれも restricted を満たしている。
# デバッグで kubectl run する Pod も runAsNonRoot・seccomp RuntimeDefault・drop ALL・
# allowPrivilegeEscalation: false が要る(rustfs.mdx の例を参照)
apiVersion: v1
kind: Namespace
metadata:
  name: worlds
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
