# Headlamp の values。in-cluster で動かし、chart が作る ServiceAccount headlamp に
# cluster-admin を束ねる(既定)。公開は HTTPRoute(httproute.yaml)で行うので ingress は使わない
config:
  inCluster: true
  baseURL: ""
serviceAccount:
  create: true
  name: headlamp
clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
