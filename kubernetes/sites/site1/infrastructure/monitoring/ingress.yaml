# Grafana / Prometheus の UI。どちらも private(oauth2-proxy)側のホスト名。
# Prometheus 自身には認証が無いので公開側(dev)には絶対に出さない(values.yaml のコメント参照)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
spec:
  ingressClassName: cilium
  rules:
    - host: grafana.site1.private.dev.morino.party
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
spec:
  ingressClassName: cilium
  rules:
    - host: prometheus.site1.private.dev.morino.party
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
