apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# kube-prometheus-stack 本体は bootstrap/applications/monitoring.yaml の Helm source。ここは付随リソース
namespace: monitoring
resources:
  - ingress.yaml
# Grafana の管理者パスワード(sops + ksops。ローカルの kubectl kustomize ではビルドできないので
# CI / make lint-kustomize の対象外)
generators:
  - secret-generator.yaml
