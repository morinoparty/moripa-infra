# Longhorn UI。UI 自体に認証が無いので、必ず private(oauth2-proxy)側のホスト名で出す
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  # group/kind/matches/weight は API の既定値。省略すると ArgoCD の diff が
  # 常に OutOfSync になるので明示する
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: ingress
  hostnames:
    - longhorn.site1.private.dev.morino.party
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: longhorn-frontend
          port: 80
          weight: 1
