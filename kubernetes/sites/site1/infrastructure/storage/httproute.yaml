# Longhorn UI。UI 自体に認証が無いので、必ず private(oauth2-proxy)側のホスト名で出す
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  parentRefs:
    - name: public
      namespace: ingress
  hostnames:
    - longhorn.site1.private.dev.morino.party
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
