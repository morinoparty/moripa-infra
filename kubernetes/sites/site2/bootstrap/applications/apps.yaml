# 第2の app-of-apps: kubernetes/apps/ 配下の各 Application を管理する
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/morinoparty/moripa-infra.git
    targetRevision: main
    path: kubernetes/sites/site2/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
