# Gateway API CRD。Cilium より先に同期される必要がある(wave -3):
# CRD が無いと Cilium は Gateway 機能をサイレントに無効化し、後入れしても
# 再起動まで有効にならない
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: git@github.com:morinoparty/moripa-infra.git
    targetRevision: main
    path: kubernetes/common/gateway-api-crds
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - ServerSideApply=true
