# 共有 Gateway。GatewayClass "cilium" は Cilium operator が自動作成する。
# gatewayAPI.hostNetwork.enabled=true(cilium values)により Envoy が全ノードの
# :80 に直接 listen し、Linode 上の Caddy(リバースプロキシ)からの転送を受ける。
# TLS は Caddy が終端するため HTTPS listener は持たない。
# 公開するホスト名は HTTPRoute の hostnames に加えて、
# ansible/group_vars/all/network.yml の proxy_routes にも登録すること
# (登録が無いと Caddy が受けない)。
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: ingress
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
